version: '3.8'

services:
  # 1. Web Server (Apache + PHP) menggunakan Dockerfile
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jurnal-mu-app
    ports:
      - "8081:80" # Akses aplikasi di http://localhost:8081
    volumes:
      - .:/var/www/html
    restart: always
    depends_on:
      - db

  # 2. Database Server (MySQL)
  db:
    image: mysql:8.0
    container_name: jurnal-mu-db
    restart: always
    environment:
      MYSQL_DATABASE: jurnal_mu
      MYSQL_ROOT_PASSWORD: "root"
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  # 3. Database Manager (phpMyAdmin)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: jurnal-mu-phpmyadmin
    restart: always
    ports:
      - "8000:80" # Akses phpMyAdmin di http://localhost:8000
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  db_data:
